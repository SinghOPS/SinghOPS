<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="177"><rect width="800" height="177" fill="#f8f3e6"/><text x="24" y="42" font-family="Georgia,serif" font-size="24" fill="#193d2b">AWS AI Chatbot for Corrections</text><text x="24" y="75" font-family="monospace" font-size="15" fill="#193d2b">Updated the infrastructure deployment guide.</text><text x="24" y="108" font-family="monospace" font-size="15" fill="#193d2b">The project provisions an Amazon Q Business assistant with a web crawler,</text><text x="24" y="131" font-family="monospace" font-size="15" fill="#193d2b">index, and retriever through AWS CDK. My upstream change was to the</text><text x="24" y="154" font-family="monospace" font-size="15" fill="#193d2b">infrastructure-as-code deployment guide used to set up that stack.</text></svg>