<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="223"><rect width="800" height="223" fill="#f8f3e6"/><text x="24" y="42" font-family="Georgia,serif" font-size="24" fill="#193d2b">PrepU</text><text x="24" y="75" font-family="monospace" font-size="15" fill="#193d2b">Added a summarizer, an API module, and face and emotion analysis modules for</text><text x="24" y="98" font-family="monospace" font-size="15" fill="#193d2b">interview tooling.</text><text x="24" y="131" font-family="monospace" font-size="15" fill="#193d2b">PrepU combines a React frontend with Python modules. My authored commits</text><text x="24" y="154" font-family="monospace" font-size="15" fill="#193d2b">introduced the summarizer, API integration module, face detection, and emotion</text><text x="24" y="177" font-family="monospace" font-size="15" fill="#193d2b">analysis, giving the project separate components for processing text and</text><text x="24" y="200" font-family="monospace" font-size="15" fill="#193d2b">visual input.</text></svg>