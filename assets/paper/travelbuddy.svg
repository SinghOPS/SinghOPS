<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="223"><rect width="800" height="223" fill="#f8f3e6"/><text x="24" y="42" font-family="Georgia,serif" font-size="24" fill="#193d2b">TravelBuddy</text><text x="24" y="75" font-family="monospace" font-size="15" fill="#193d2b">Built out the Swift UI and navigation and integrated text and image generation</text><text x="24" y="98" font-family="monospace" font-size="15" fill="#193d2b">APIs.</text><text x="24" y="131" font-family="monospace" font-size="15" fill="#193d2b">My iOS work included the login screen, the initial navigation flow, and</text><text x="24" y="154" font-family="monospace" font-size="15" fill="#193d2b">integration of the screens into a working interface. I then connected both</text><text x="24" y="177" font-family="monospace" font-size="15" fill="#193d2b">generation APIs and removed the earlier SwiftData dependency as part of that</text><text x="24" y="200" font-family="monospace" font-size="15" fill="#193d2b">integration.</text></svg>