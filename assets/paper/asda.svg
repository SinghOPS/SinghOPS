<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="223"><rect width="800" height="223" fill="#f8f3e6"/><text x="24" y="42" font-family="Georgia,serif" font-size="24" fill="#193d2b">ASDA</text><text x="24" y="75" font-family="monospace" font-size="15" fill="#193d2b">Authored nine upstream commits, including a crawler and Flask UI updates to a</text><text x="24" y="98" font-family="monospace" font-size="15" fill="#193d2b">Form 990 search prototype.</text><text x="24" y="131" font-family="monospace" font-size="15" fill="#193d2b">The prototype helps users explore nonprofit tax filings by city, state, gross</text><text x="24" y="154" font-family="monospace" font-size="15" fill="#193d2b">revenue, and net revenue. My work spanned the JavaScript crawler and retrieval</text><text x="24" y="177" font-family="monospace" font-size="15" fill="#193d2b">code, HTML templates and styles, and formatting changes in the Flask</text><text x="24" y="200" font-family="monospace" font-size="15" fill="#193d2b">application.</text></svg>